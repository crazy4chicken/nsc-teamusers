openapi: 3.1.0
info:
  title: Teamusers API
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Nekostick /iam Strip forwarding
tags:
  - Authorization
paths:
  /authz/check:
    post:
      tags:
        - Authorization
      summary: Evaluate a permission
      description: Use from a trusted application service to make a single authorization decision for a user and resource context. The caller must use a service-kind bearer token; condition failures fail closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                context:
                  properties:
                    resource:
                      properties:
                        attrs:
                          additionalProperties: true
                          type: object
                        owner_id:
                          type: string
                        team_id:
                          type: string
                      required:
                        - owner_id
                        - team_id
                        - attrs
                      type: object
                  required:
                    - resource
                  type: object
                permission:
                  type: string
                subject:
                  type: string
              required:
                - subject
                - permission
                - context
              type: object
            example:
              context:
                resource:
                  attrs:
                    region: us-east-1
                  owner_id: 01J8Z3OWNER000000000000001
                  team_id: 01J8Z3TEAM000000000000001
              permission: orders:read:team
              subject: 01J8Z3USER000000000000001
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  allow:
                    type: boolean
                  matched:
                    items:
                      type: string
                    type: array
                  reason:
                    type: string
                required:
                  - allow
                  - matched
                  - reason
                type: object
              example:
                allow: true
                matched:
                  - orders:read:team
                reason: permission granted
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: subject is required
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: a service subject is required
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: the requested user was not found
        "422":
          description: Invalid Permission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Permission
                status: 422
                detail: permission must use resource:action:scope grammar
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authorization service unavailable
      security:
        - bearerAuth: []
  /authz/permissions/{userID}:
    get:
      tags:
        - Authorization
      summary: List effective grants
      description: Use from a trusted service to refresh an authorization cache for one user. The service-kind bearer token is required; perm_ver lets consumers invalidate cached grants.
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  grants:
                    items:
                      properties:
                        condition:
                          anyOf:
                            - type: string
                            - type: "null"
                        key:
                          type: string
                      required:
                        - key
                      type: object
                    type: array
                  perm_ver:
                    type: integer
                  user_id:
                    type: string
                required:
                  - user_id
                  - perm_ver
                  - grants
                type: object
              example:
                grants:
                  - key: orders:read:team
                  - condition: resource.owner_id == subject.id
                    key: orders:update:own
                perm_ver: 3
                user_id: 01J8Z3USER000000000000001
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: the requested user was not found
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authorization service unavailable
      security:
        - bearerAuth: []
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required:
        - type
        - title
        - status
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: EdDSA JWT
