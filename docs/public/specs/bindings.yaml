openapi: 3.1.0
info:
  title: Teamusers API
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Nekostick /iam Strip forwarding
tags:
  - Bindings
paths:
  /bindings/:
    get:
      tags:
        - Bindings
      summary: List role bindings for a subject
      description: Use to inspect a user's or group's role assignments. Both subject_kind and subject_id are required; cursor pages are scoped to that subject.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
              example:
                items:
                  - condition: resource.team_id == subject.team_id
                    expires_at: "2026-02-01T00:00:00Z"
                    id: 01J8Z3BIND000000000000001
                    role_id: 01J8Z3ROLE000000000000001
                    subject_id: 01J8Z3USER000000000000001
                    subject_kind: user
                    team_id: 01J8Z3TEAM000000000000001
                next_cursor: ""
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: subject_kind and subject_id are required
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: insufficient_permissions
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
    post:
      tags:
        - Bindings
      summary: Create a role binding
      description: Use to assign a role to a user or group. Optional team_id, condition, and expires_at constrain scope; conditions are compiled before persistence and fail closed at evaluation time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                condition:
                  anyOf:
                    - type: string
                    - type: "null"
                expires_at:
                  anyOf:
                    - format: date-time
                      type: string
                    - type: "null"
                role_id:
                  type: string
                subject_id:
                  type: string
                subject_kind:
                  type: string
                team_id:
                  anyOf:
                    - type: string
                    - type: "null"
              required:
                - team_id
                - role_id
                - subject_kind
                - subject_id
                - condition
                - expires_at
              type: object
            example:
              condition: resource.team_id == subject.team_id
              expires_at: "2026-02-01T00:00:00Z"
              id: 01J8Z3BIND000000000000001
              role_id: 01J8Z3ROLE000000000000001
              subject_id: 01J8Z3USER000000000000001
              subject_kind: user
              team_id: 01J8Z3TEAM000000000000001
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  condition:
                    anyOf:
                      - type: string
                      - type: "null"
                  expires_at:
                    anyOf:
                      - format: date-time
                        type: string
                      - type: "null"
                  id:
                    type: string
                  role_id:
                    type: string
                  subject_id:
                    type: string
                  subject_kind:
                    type: string
                  team_id:
                    anyOf:
                      - type: string
                      - type: "null"
                required:
                  - id
                  - role_id
                  - subject_kind
                  - subject_id
                type: object
              example:
                condition: resource.team_id == subject.team_id
                expires_at: "2026-02-01T00:00:00Z"
                id: 01J8Z3BIND000000000000001
                role_id: 01J8Z3ROLE000000000000001
                subject_id: 01J8Z3USER000000000000001
                subject_kind: user
                team_id: 01J8Z3TEAM000000000000001
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: request body must be valid JSON
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: insufficient_permissions
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: the requested resource was not found
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: the resource already exists
        "422":
          description: Invalid Condition
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Condition
                status: 422
                detail: condition could not be compiled
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
  /bindings/{id}:
    delete:
      tags:
        - Bindings
      summary: Delete a role binding
      description: Use to remove a role assignment. Affected users' permission versions are invalidated and the deletion is audited.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: insufficient_permissions
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: the requested resource was not found
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required:
        - type
        - title
        - status
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: EdDSA JWT
