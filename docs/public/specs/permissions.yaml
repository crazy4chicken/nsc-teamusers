openapi: 3.1.0
info:
  title: Teamusers API
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Nekostick /iam Strip forwarding
tags:
  - Permissions
paths:
  /permissions/:
    get:
      tags:
        - Permissions
      summary: List registered permissions
      description: Use to populate policy editors and validate role changes. Requires iam:permissions:any and returns cursor pages.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
              example:
                items:
                  - created_at: "2026-01-01T00:00:00Z"
                    description: Read orders in a team
                    key: orders:read:team
                    registered_by: orders-service
                next_cursor: ""
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: limit must be a positive integer
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: insufficient_permissions
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
    post:
      tags:
        - Permissions
      summary: Register or update a permission
      description: Use when an application service introduces a permission key. Keys must follow resource:action:scope grammar; registration is an upsert and increments the global permission registry version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                description:
                  type: string
                key:
                  type: string
                registered_by:
                  type: string
              required:
                - key
                - description
                - registered_by
              type: object
            example:
              description: Read orders in a team
              key: orders:read:team
              registered_by: orders-service
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  created_at:
                    format: date-time
                    type: string
                  description:
                    type: string
                  key:
                    type: string
                  registered_by:
                    type: string
                required:
                  - key
                  - description
                  - registered_by
                  - created_at
                type: object
              example:
                created_at: "2026-01-01T00:00:00Z"
                description: Read orders in a team
                key: orders:read:team
                registered_by: orders-service
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: request body must be valid JSON
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: insufficient_permissions
        "422":
          description: Invalid Permission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Permission
                status: 422
                detail: permission must use resource:action:scope grammar
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required:
        - type
        - title
        - status
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: EdDSA JWT
