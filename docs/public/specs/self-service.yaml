openapi: 3.1.0
info:
  title: Teamusers API
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Nekostick /iam Strip forwarding
tags:
  - Self-service
paths:
  /me:
    delete:
      tags:
        - Self-service
      summary: Erase the current account
      description: Use when a user requests irreversible account erasure. The password is rechecked; profile identifiers are anonymized, all credentials and sessions are removed, and the account is disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                password:
                  type: string
              required:
                - password
              type: object
            example:
              password: CurrentAtLeastTwelve1
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: request body must be valid JSON
        "401":
          description: invalid_credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: invalid_credentials
                status: 401
                detail: invalid_credentials
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: authentication temporarily busy
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
    get:
      tags:
        - Self-service
      summary: Get the current profile
      description: Use from a signed-in user interface to display the authenticated user's profile. The identity is always taken from the user bearer subject; credentials and other users' data are never returned.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  created_at:
                    format: date-time
                    type: string
                  display_name:
                    type: string
                  email:
                    anyOf:
                      - type: string
                      - type: "null"
                  email_verified_at:
                    anyOf:
                      - format: date-time
                        type: string
                      - type: "null"
                  id:
                    type: string
                  status:
                    type: string
                  username:
                    type: string
                required:
                  - id
                  - username
                  - display_name
                  - status
                  - created_at
                type: object
              example:
                created_at: "2026-01-01T00:00:00Z"
                display_name: Alice Example
                email: alice@example.test
                email_verified_at: "2026-01-01T00:00:00Z"
                id: 01J8Z3USER000000000000001
                status: active
                username: alice
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: the requested resource was not found
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
    patch:
      tags:
        - Self-service
      summary: Update the current display name
      description: Use when a user edits their own display name. Only display_name is accepted; email changes use the two-step email endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                display_name:
                  type: string
              required:
                - display_name
              type: object
            example:
              display_name: Alice Smith
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  created_at:
                    format: date-time
                    type: string
                  display_name:
                    type: string
                  email:
                    anyOf:
                      - type: string
                      - type: "null"
                  email_verified_at:
                    anyOf:
                      - format: date-time
                        type: string
                      - type: "null"
                  id:
                    type: string
                  status:
                    type: string
                  username:
                    type: string
                required:
                  - id
                  - username
                  - display_name
                  - status
                  - created_at
                type: object
              example:
                created_at: "2026-01-01T00:00:00Z"
                display_name: Alice Smith
                email: alice@example.test
                email_verified_at: "2026-01-01T00:00:00Z"
                id: 01J8Z3USER000000000000001
                status: active
                username: alice
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: display_name is required
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "422":
          description: Unsupported Field; Unsupported Field
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                unsupported_field:
                  value:
                    type: about:blank
                    title: Unsupported Field
                    status: 422
                    detail: unsupported_field
                email change is not supported:
                  value:
                    type: about:blank
                    title: Unsupported Field
                    status: 422
                    detail: email change is not supported
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
  /me/email:
    post:
      tags:
        - Self-service
      summary: Request an email change
      description: Use when a user wants to replace their email. The current password is required; a single-use verification token is sent to the new address and the profile remains unchanged until confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                new_email:
                  type: string
                password:
                  type: string
              required:
                - new_email
                - password
              type: object
            example:
              new_email: alice.new@example.test
              password: CurrentAtLeastTwelve1
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: request body must be valid JSON
        "401":
          description: invalid_credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: invalid_credentials
                status: 401
                detail: invalid_credentials
        "422":
          description: invalid_email; email_taken
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalid_email:
                  value:
                    type: about:blank
                    title: invalid_email
                    status: 422
                    detail: invalid_email
                email_taken:
                  value:
                    type: about:blank
                    title: email_taken
                    status: 422
                    detail: email_taken
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: authentication temporarily busy
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
  /me/email/confirm:
    post:
      tags:
        - Self-service
      summary: Confirm an email change
      description: Use with the one-time token sent to the replacement address. The token is bound to the bearer subject; success updates email_verified_at and the email atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                token:
                  type: string
              required:
                - token
              type: object
            example:
              token: email-change-token-from-email
      responses:
        "204":
          description: No Content
        "400":
          description: invalid_token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: invalid_token
                status: 400
                detail: invalid_token
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
  /me/export:
    get:
      tags:
        - Self-service
      summary: Export current account data
      description: Use to satisfy a data portability request. The response is an attachment containing profile, memberships, effective permissions, active sessions, and MFA/passkey counts; secrets and credential material are excluded.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  active_sessions:
                    items:
                      properties:
                        created_at:
                          format: date-time
                          type: string
                        expires_at:
                          format: date-time
                          type: string
                        id:
                          type: string
                      required:
                        - id
                        - created_at
                        - expires_at
                      type: object
                    type: array
                  effective_permissions:
                    items:
                      type: string
                    type: array
                  memberships:
                    items:
                      properties:
                        group_id:
                          type: string
                        team_id:
                          type: string
                      required:
                        - group_id
                        - team_id
                      type: object
                    type: array
                  passkey_count:
                    type: integer
                  profile:
                    properties:
                      created_at:
                        format: date-time
                        type: string
                      display_name:
                        type: string
                      email:
                        anyOf:
                          - type: string
                          - type: "null"
                      email_verified_at:
                        anyOf:
                          - format: date-time
                            type: string
                          - type: "null"
                      id:
                        type: string
                      status:
                        type: string
                      username:
                        type: string
                    required:
                      - id
                      - username
                      - display_name
                      - status
                      - created_at
                    type: object
                  totp_enabled:
                    type: boolean
                required:
                  - profile
                  - memberships
                  - effective_permissions
                  - active_sessions
                  - totp_enabled
                  - passkey_count
                type: object
              example:
                active_sessions:
                  - created_at: "2026-01-01T00:00:00Z"
                    expires_at: "2026-01-31T00:00:00Z"
                    id: 8d7e5b3a0f6f4e1d...
                effective_permissions:
                  - orders:read:team
                memberships:
                  - group_id: 01J8Z3GROUP000000000000001
                    team_id: 01J8Z3TEAM000000000000001
                passkey_count: 0
                profile:
                  created_at: "2026-01-01T00:00:00Z"
                  display_name: Alice Example
                  email: alice@example.test
                  email_verified_at: "2026-01-01T00:00:00Z"
                  id: 01J8Z3USER000000000000001
                  status: active
                  username: alice
                totp_enabled: false
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
  /me/passkeys:
    get:
      tags:
        - Self-service
      summary: List own passkeys
      description: Use in account security settings to show registered passkey identifiers. Public keys and attestation data are never returned.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                items:
                  properties:
                    created_at:
                      format: date-time
                      type: string
                    id:
                      type: string
                  required:
                    - id
                    - created_at
                  type: object
                type: array
              example:
                - created_at: "2026-01-01T00:00:00Z"
                  id: base64url-credential-id
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
  /me/passkeys/register/begin:
    post:
      tags:
        - Self-service
      summary: Begin passkey registration
      description: Use from a signed-in browser to add a WebAuthn credential. The browser passes the returned publicKey options to navigator.credentials.create; the ceremony expires after five minutes.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
              example:
                publicKey:
                  attestation: none
                  challenge: base64url-challenge
                  pubKeyCredParams:
                    - alg: -7
                      type: public-key
                  rp:
                    id: localhost
                    name: teamusers
                  user:
                    displayName: Alice Example
                    id: base64url-user-handle
                    name: alice
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
  /me/passkeys/register/finish:
    post:
      tags:
        - Self-service
      summary: Finish passkey registration
      description: Use with the browser's PublicKeyCredential creation response. A valid response consumes the single-use challenge and stores only the credential material required for WebAuthn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                id:
                  type: string
                rawId:
                  type: string
                response:
                  additionalProperties:
                    type: string
                  type: object
                type:
                  type: string
              required:
                - id
                - rawId
                - type
                - response
              type: object
            example:
              id: base64url-credential-id
              rawId: base64url-credential-id
              response:
                attestationObject: base64url-attestation
                clientDataJSON: base64url-client-data
              type: public-key
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: invalid WebAuthn response
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
  /me/passkeys/{credID}:
    delete:
      tags:
        - Self-service
      summary: Delete one own passkey
      description: Use to remove a passkey by its unpadded base64url credential ID. Unknown IDs return the same not-found problem regardless of ownership.
      parameters:
        - name: credID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: the requested passkey was not found
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
  /me/password:
    post:
      tags:
        - Self-service
      summary: Change the current password
      description: Use when a signed-in user rotates their password. The current password is verified, the replacement must satisfy policy, and every refresh session (including the current one) is revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
              required:
                - current_password
                - new_password
              type: object
            example:
              current_password: OldAtLeastTwelve1
              new_password: NewAtLeastTwelve2
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
              example:
                message: password changed; all sessions were revoked; sign in again
                sessions_revoked: true
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: request body must be valid JSON
        "401":
          description: invalid_credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: invalid_credentials
                status: 401
                detail: invalid_credentials
        "422":
          description: weak_password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: weak_password
                status: 422
                detail: weak_password
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: authentication temporarily busy
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
  /me/totp:
    delete:
      tags:
        - Self-service
      summary: Disable TOTP
      description: Use when a user removes MFA. Submit a current TOTP code or unused backup code; active TOTP, pending TOTP, and backup credentials are deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                code:
                  type: string
              required:
                - code
              type: object
            example:
              code: "123456"
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: request body must be valid JSON
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
  /me/totp/backup-codes:
    post:
      tags:
        - Self-service
      summary: Regenerate TOTP backup codes
      description: Use when backup codes are exhausted or suspected exposed. The current password and an active TOTP enrollment are required; old codes are replaced atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                password:
                  type: string
              required:
                - password
              type: object
            example:
              password: CurrentAtLeastTwelve1
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  backup_codes:
                    items:
                      type: string
                    type: array
                required:
                  - backup_codes
                type: object
              example:
                backup_codes:
                  - abcd-1234-efgh-5678
                  - 9ijk-lmno-0123-pqrs
                  - 1111-2222-3333-4444
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: request body must be valid JSON
        "401":
          description: invalid_credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: invalid_credentials
                status: 401
                detail: invalid_credentials
        "404":
          description: mfa_not_enrolled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: mfa_not_enrolled
                status: 404
                detail: mfa_not_enrolled
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: authentication temporarily busy
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
  /me/totp/confirm:
    post:
      tags:
        - Self-service
      summary: Confirm TOTP enrollment
      description: Use after scanning the enrollment QR code. Submit the current six-digit code; the pending secret becomes active and ten one-time backup codes are returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                code:
                  type: string
              required:
                - code
              type: object
            example:
              code: "123456"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  backup_codes:
                    items:
                      type: string
                    type: array
                required:
                  - backup_codes
                type: object
              example:
                backup_codes:
                  - abcd-1234-efgh-5678
                  - 9ijk-lmno-0123-pqrs
