openapi: 3.1.0
info:
  title: Teamusers API
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Nekostick /iam Strip forwarding
tags:
  - Groups
paths:
  /groups/:
    get:
      tags:
        - Groups
      summary: List groups in a team
      description: Use to page through groups for one team. team_id is required because groups are team-scoped; requires iam:groups:any.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
              example:
                items:
                  - id: 01J8Z3GROUP000000000000001
                    name: backend
                    team_id: 01J8Z3TEAM000000000000001
                next_cursor: ""
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: limit must be a positive integer
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: insufficient_permissions
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: the requested resource was not found
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
    post:
      tags:
        - Groups
      summary: Create a group
      description: Use to create a team-scoped group that can receive memberships and role bindings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                team_id:
                  type: string
              required:
                - team_id
                - name
              type: object
            example:
              name: backend
              team_id: 01J8Z3TEAM000000000000001
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  team_id:
                    type: string
                required:
                  - id
                  - team_id
                  - name
                type: object
              example:
                id: 01J8Z3GROUP000000000000001
                name: backend
                team_id: 01J8Z3TEAM000000000000001
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: request body must be valid JSON
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: insufficient_permissions
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: the requested resource was not found
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: the resource already exists
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
  /groups/{id}:
    delete:
      tags:
        - Groups
      summary: Delete a group
      description: Use to remove a group and its memberships. Affected users' permission versions are invalidated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: insufficient_permissions
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: the requested resource was not found
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
    get:
      tags:
        - Groups
      summary: Get a group
      description: Use to retrieve one group by ULID, including its owning team ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  team_id:
                    type: string
                required:
                  - id
                  - team_id
                  - name
                type: object
              example:
                id: 01J8Z3GROUP000000000000001
                name: backend
                team_id: 01J8Z3TEAM000000000000001
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: insufficient_permissions
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: the requested resource was not found
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
    patch:
      tags:
        - Groups
      summary: Update a group
      description: Use to rename a group or move it to another team. At least one of team_id and name is required; memberships are updated when the team changes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  anyOf:
                    - type: string
                    - type: "null"
                team_id:
                  anyOf:
                    - type: string
                    - type: "null"
              required:
                - team_id
                - name
              type: object
            example:
              name: platform-backend
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  team_id:
                    type: string
                required:
                  - id
                  - team_id
                  - name
                type: object
              example:
                id: 01J8Z3GROUP000000000000001
                name: platform-backend
                team_id: 01J8Z3TEAM000000000000001
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: request body must be valid JSON
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: insufficient_permissions
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: the requested resource was not found
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
  /groups/{id}/members:
    delete:
      tags:
        - Groups
      summary: Remove a group member by request body
      description: Use to remove a membership when the client has the group ID but sends the user ID as JSON. The path variant with userID is equivalent and is preferred for idempotent URL-based clients.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                expires_at:
                  anyOf:
                    - format: date-time
                      type: string
                    - type: "null"
                user_id:
                  type: string
              required:
                - user_id
                - expires_at
              type: object
            example:
              user_id: 01J8Z3USER000000000000001
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: request body must be valid JSON
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: insufficient_permissions
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: the requested resource was not found
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
    put:
      tags:
        - Groups
      summary: Add or replace a group membership
      description: Use to add a user to a group or update that membership's expiry. The operation is idempotent and returns the complete membership record.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                expires_at:
                  anyOf:
                    - format: date-time
                      type: string
                    - type: "null"
                user_id:
                  type: string
              required:
                - user_id
                - expires_at
              type: object
            example:
              expires_at: "2026-02-01T00:00:00Z"
              user_id: 01J8Z3USER000000000000001
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  expires_at:
                    anyOf:
                      - format: date-time
                        type: string
                      - type: "null"
                  group_id:
                    type: string
                  team_id:
                    type: string
                  user_id:
                    type: string
                required:
                  - team_id
                  - group_id
                  - user_id
                type: object
              example:
                expires_at: "2026-02-01T00:00:00Z"
                group_id: 01J8Z3GROUP000000000000001
                team_id: 01J8Z3TEAM000000000000001
                user_id: 01J8Z3USER000000000000001
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: request body must be valid JSON
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: insufficient_permissions
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: the requested resource was not found
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
  /groups/{id}/members/batch:
    post:
      tags:
        - Groups
      summary: Add group members in a batch
      description: Use to bulk-populate a group. Up to 500 user IDs are processed independently; duplicate rows report already_member and unknown users report not_found.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_ids:
                  items:
                    type: string
                  type: array
              required:
                - user_ids
              type: object
            example:
              user_ids:
                - 01J8Z3USER000000000000001
                - 01J8Z3USER000000000000002
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
              example:
                results:
                  - id: 01J8Z3USER000000000000001
                    ok: true
                  - error: already_member
                    id: 01J8Z3USER000000000000002
                    ok: false
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: request body must be valid JSON
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: insufficient_permissions
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: the requested resource was not found
        "422":
          description: Too Many Items
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Too Many Items
                status: 422
                detail: a maximum of 500 user_ids is allowed
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
  /groups/{id}/members/{userID}:
    delete:
      tags:
        - Groups
      summary: Remove a group member
      description: Use to remove a membership by group and user ULIDs. Unknown group, user, or membership returns a generic not-found problem.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: insufficient_permissions
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: the requested resource was not found
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required:
        - type
        - title
        - status
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: EdDSA JWT
