openapi: 3.1.0
info:
  title: Teamusers API
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Nekostick /iam Strip forwarding
tags:
  - Authentication
paths:
  /.well-known/jwks.json:
    get:
      tags:
        - Authentication
      summary: Fetch public signing keys
      description: Use this public endpoint to validate teamusers EdDSA JWT signatures locally. API gateways and services call it and cache the returned key set by kid.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
              example:
                keys:
                  - alg: EdDSA
                    crv: Ed25519
                    kid: 01J8Z3KEY00000000000000001
                    kty: OKP
                    use: sig
                    x: 11qYAYL9f3rK3z7Z4Yj6d8bYJQ4mC3bX2h0qk8mVqB8
        "500":
          description: Signing key set could not be encoded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Signing key set could not be encoded
                status: 500
                detail: jwks unavailable
      security: []
  /auth/client-credentials:
    post:
      tags:
        - Authentication
      summary: Obtain a service token
      description: Use for service-to-service authentication. The caller presents the client ID (service user's username) and one-time secret created by POST /users/{id}/credentials with kind service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
              required:
                - client_id
                - client_secret
              type: object
            example:
              client_id: orders-service
              client_secret: generated-service-secret
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                required:
                  - access_token
                  - refresh_token
                  - token_type
                  - expires_in
                type: object
              example:
                access_token: eyJhbGciOiJFZERTQSIs...
                expires_in: 600
                refresh_token: refresh-token-opaque
                token_type: Bearer
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: request body must be valid JSON
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "423":
          description: account_locked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: account_locked
                status: 423
                detail: account_locked
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: authentication temporarily busy
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security: []
  /auth/introspect:
    post:
      tags:
        - Authentication
      summary: Introspect an access or refresh token
      description: Use from a trusted service to check whether a token is active without exposing token material. The caller must authenticate with a service-kind EdDSA bearer token; inactive or missing input still returns 200 with active false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                token:
                  type: string
              required:
                - token
              type: object
            example:
              token: eyJhbGciOiJFZERTQSIs...
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  active:
                    type: boolean
                  exp:
                    type: integer
                  kind:
                    type: string
                  perm_ver:
                    type: integer
                  sub:
                    type: string
                  team:
                    type: string
                required:
                  - active
                type: object
              example:
                active: true
                exp: 1760000000
                kind: user
                perm_ver: 3
                sub: 01J8Z3USER000000000000001
                team: 01J8Z3TEAM000000000000001
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: authentication temporarily busy
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security:
        - bearerAuth: []
  /auth/invite/accept:
    post:
      tags:
        - Authentication
      summary: Accept an invitation
      description: Use from an invitation email to set the initial password and activate the invited account. The invitation email is marked verified; display_name is optional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                display_name:
                  anyOf:
                    - type: string
                    - type: "null"
                password:
                  type: string
                token:
                  type: string
              required:
                - token
                - password
                - display_name
              type: object
            example:
              display_name: Alice Example
              password: NewAtLeastTwelve1
              token: invitation-token-from-email
      responses:
        "204":
          description: No Content
        "400":
          description: invalid_token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: invalid_token
                status: 400
                detail: invalid_token
        "422":
          description: weak_password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: weak_password
                status: 422
                detail: weak_password
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: authentication temporarily busy
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security: []
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Sign in with a password
      description: Use when an end user needs an access and refresh token pair. A valid account with TOTP enabled receives an MFA challenge instead; clients then call POST /auth/login/mfa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                password:
                  type: string
                username:
                  type: string
              required:
                - username
                - password
              type: object
            example:
              password: AtLeastTwelve1
              username: alice
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                required:
                  - access_token
                  - refresh_token
                  - token_type
                  - expires_in
                type: object
              example:
                access_token: eyJhbGciOiJFZERTQSIs...
                expires_in: 600
                refresh_token: refresh-token-opaque
                token_type: Bearer
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: request body must be valid JSON
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "403":
          description: account_pending
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: account_pending
                status: 403
                detail: account_pending
        "423":
          description: account_locked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: account_locked
                status: 423
                detail: account_locked
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: authentication temporarily busy
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security: []
  /auth/login/mfa:
    post:
      tags:
        - Authentication
      summary: Complete MFA login
      description: Use after password login returns mfa_required. Submit the short-lived MFA token and either a current TOTP code or one unused backup code; success returns the normal token pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                code:
                  type: string
                mfa_token:
                  type: string
              required:
                - mfa_token
                - code
              type: object
            example:
              code: "123456"
              mfa_token: eyJhbGciOiJFZERTQSIs...
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                required:
                  - access_token
                  - refresh_token
                  - token_type
                  - expires_in
                type: object
              example:
                access_token: eyJhbGciOiJFZERTQSIs...
                expires_in: 600
                refresh_token: refresh-token-opaque
                token_type: Bearer
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: request body must be valid JSON
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "423":
          description: account_locked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: account_locked
                status: 423
                detail: account_locked
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: authentication temporarily busy
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security: []
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Revoke a refresh-token family
      description: 'Use when a client signs out. The operation is intentionally idempotent: missing, malformed, unknown, expired, or already-revoked refresh tokens produce 204 and do not disclose token state.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                refresh_token:
                  type: string
              required:
                - refresh_token
              type: object
            example:
              refresh_token: refresh-token-opaque
      responses:
        "204":
          description: No Content
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: authentication temporarily busy
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security: []
  /auth/passkey/login/begin:
    post:
      tags:
        - Authentication
      summary: Begin passkey login
      description: Use to begin a WebAuthn assertion. Pass an optional username for a scoped ceremony, or an empty body for discoverable credentials; the browser passes the returned publicKey options to navigator.credentials.get.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                username:
                  type: string
              required:
                - username
              type: object
            example:
              username: alice
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
              example:
                publicKey:
                  allowCredentials:
                    - id: base64url-credential-id
                      type: public-key
                  challenge: base64url-challenge
                  rpId: localhost
                  timeout: 300000
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "423":
          description: account_locked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: account_locked
                status: 423
                detail: account_locked
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: authentication temporarily busy
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security: []
  /auth/passkey/login/finish:
    post:
      tags:
        - Authentication
      summary: Finish passkey login
      description: Use with the browser's PublicKeyCredential assertion response from the begin operation. A valid assertion issues the normal user token pair; failed assertions contribute to account lockout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
            example:
              id: base64url-credential-id
              rawId: base64url-credential-id
              response:
                authenticatorData: base64url-authenticator-data
                clientDataJSON: base64url-client-data
                signature: base64url-signature
              type: public-key
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                required:
                  - access_token
                  - refresh_token
                  - token_type
                  - expires_in
                type: object
              example:
                access_token: eyJhbGciOiJFZERTQSIs...
                expires_in: 600
                refresh_token: refresh-token-opaque
                token_type: Bearer
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: invalid WebAuthn response
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "423":
          description: account_locked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: account_locked
                status: 423
                detail: account_locked
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: authentication temporarily busy
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security: []
  /auth/password-reset/confirm:
    post:
      tags:
        - Authentication
      summary: Confirm a password reset
      description: Use with the one-time token delivered by the notification service. The new password must satisfy policy; success revokes all sessions and clears lockout state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                new_password:
                  type: string
                token:
                  type: string
              required:
                - token
                - new_password
              type: object
            example:
              new_password: NewAtLeastTwelve1
              token: reset-token-from-email
      responses:
        "204":
          description: No Content
        "400":
          description: invalid_token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: invalid_token
                status: 400
                detail: invalid_token
        "422":
          description: weak_password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: weak_password
                status: 422
                detail: weak_password
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: authentication temporarily busy
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security: []
  /auth/password-reset/request:
    post:
      tags:
        - Authentication
      summary: Request a password reset
      description: Use when a user has lost a password. Submit a username or email; the endpoint always returns 204 so callers cannot enumerate accounts. A notification event is emitted only for an active matching account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                login:
                  type: string
              required:
                - login
              type: object
            example:
              login: alice@example.test
      responses:
        "204":
          description: No Content
      security: []
  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Rotate a refresh token
      description: Use to obtain a fresh access/refresh pair without prompting the user for a password. Rotation revokes the presented token; reuse or expiry invalidates the request and can revoke its whole family.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                refresh_token:
                  type: string
              required:
                - refresh_token
              type: object
            example:
              refresh_token: refresh-token-opaque
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                required:
                  - access_token
                  - refresh_token
                  - token_type
                  - expires_in
                type: object
              example:
                access_token: eyJhbGciOiJFZERTQSIs...
                expires_in: 600
                refresh_token: refresh-token-rotated
                token_type: Bearer
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: request body must be valid JSON
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: authentication failed
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: authentication temporarily busy
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security: []
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a user
      description: Use for public self-registration when registration mode is open or approval. A web or mobile client submits the profile and password; the service creates a pending account and sends an email verification notification. Closed mode rejects registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                display_name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                username:
                  type: string
              required:
                - username
                - email
                - password
                - display_name
              type: object
            example:
              display_name: Alice Example
              email: alice@example.test
              password: AtLeastTwelve1
              username: alice
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
              example:
                id: 01J8Z3USER000000000000001
                status: pending
        "400":
          description: Invalid Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Invalid Request
                status: 400
                detail: request body must be valid JSON
        "403":
          description: registration_closed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: registration_closed
                status: 403
                detail: registration_closed
        "422":
          description: weak_password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: weak_password
                status: 422
                detail: weak_password
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: authentication temporarily busy
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: authentication service unavailable
      security: []
  /auth/verify-email:
    post:
      tags:
        - Authentication
      summary: Verify an email address
      description: Use from the link or token delivered by the notification service after registration. It marks the account verified and, in open mode, activates it; approval mode still requires administrator approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                token:
                  type: string
              required:
                - token
              type: object
            example:
