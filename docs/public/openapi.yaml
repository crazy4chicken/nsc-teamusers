                          type: string
                        team_id:
                          type: string
                      type: object
                  type: object
                permission:
                  type: string
                subject:
                  type: string
              required:
                - subject
                - permission
              type: object
            example:
              context:
                resource:
                  attrs:
                    region: us-east-1
                  owner_id: 01J8Z3OWNER000000000000001
                  team_id: 01J8Z3TEAM000000000000001
              permission: orders:read:team
              subject: 01J8Z3USER000000000000001
