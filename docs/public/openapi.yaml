        "200":
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  allow:
                    type: boolean
                  matched:
                    items:
                      type: string
                    type: array
                  reason:
                    type: string
                required:
                  - allow
                  - matched
                  - reason
