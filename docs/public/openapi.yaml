openapi: 3.1.0
info:
  title: teamusers API
  version: 1.0.0
  description: |
    teamusers is a JSON HTTP identity, authentication, authorization, and
    administration service. The public authentication plane issues EdDSA JWT
    access tokens and rotating refresh tokens; the service-only authorization
    plane evaluates permissions; and the admin and self-service planes manage
    users and policy. Errors use RFC 9457 application/problem+json.
servers:
  - url: http://localhost:8080
    description: Local listener. When published through Nekostick in Strip mode,
      prepend /iam to the public URL; Nekostick removes that prefix before
      forwarding to teamusers.
tags:
  - name: Health
    description: Liveness and readiness probes.
  - name: Authentication
    description: Public registration, login, token, invitation, reset, and passkey flows.
  - name: Authorization
    description: Service-to-service permission evaluation and effective grants.
  - name: Self-service
    description: Authenticated user profile, credentials, sessions, MFA, and passkeys.
  - name: Users
    description: Administrative user lifecycle and credential operations.
  - name: Teams
    description: Administrative team lifecycle.
  - name: Groups
    description: Administrative groups and memberships.
  - name: Roles
    description: Administrative role and role-permission operations.
  - name: Permissions
    description: Administrative permission registry operations.
  - name: Bindings
    description: Administrative role binding operations.
  - name: Audit
    description: Append-only administrative audit log.
  - name: Sessions
    description: Administrative refresh-session inspection and revocation.
  - name: Invitations
    description: Administrative invitation lifecycle.
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Check liveness
      description: Use this inexpensive unauthenticated probe to determine whether the HTTP process is alive. Load balancers and orchestrators call it without credentials.
      operationId: healthz
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
              example: { status: ok }
  /readyz:
    get:
      tags: [Health]
      summary: Check readiness
      description: Use this unauthenticated probe before routing traffic. It checks database readiness and returns not_ready while dependencies are unavailable.
      operationId: readyz
      security: []
      responses:
        '200':
          description: Database and service are ready.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
              example: { status: ready }
        '503':
          description: Database is unavailable or the readiness pool is not configured.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: not_ready }
              example: { status: not_ready }
  /.well-known/jwks.json:
    get:
      tags: [Authentication]
      summary: Fetch public signing keys
      description: Use this public endpoint to validate teamusers EdDSA JWT signatures locally. API gateways and services call it and cache the returned key set by kid.
      operationId: getJwks
      security: []
      responses:
        '200':
          description: JSON Web Key Set containing public Ed25519 keys only.
          content:
            application/jwk-set+json:
              schema: { $ref: '#/components/schemas/JsonWebKeySet' }
              example:
                keys:
                  - kid: 01J8Z3KEY00000000000000001
                    kty: OKP
                    crv: Ed25519
                    alg: EdDSA
                    use: sig
                    x: 11qYAYL9f3rK3z7Z4Yj6d8bYJQ4mC3bX2h0qk8mVqB8
        '500':
          description: Signing key set could not be encoded.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
              example: { error: jwks unavailable }
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a user
      description: Use for public self-registration when registration mode is open or approval. A web or mobile client submits the profile and password; the service creates a pending account and sends an email verification notification. Closed mode rejects registration.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example:
              username: alice
              email: alice@example.test
              password: AtLeastTwelve1
              display_name: Alice Example
      responses:
        '201':
          description: Pending user created.
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, description: ULID }
                  status: { type: string, example: pending }
              example: { id: 01J8Z3USER000000000000001, status: pending }
        '400':
          description: Malformed JSON or invalid username/email.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              examples:
                invalid_json:
                  value: { type: about:blank, title: Invalid Request, status: 400, detail: request body must be valid JSON, instance: 01J8Z3REQ00000000000000001 }
                invalid_email:
                  value: { type: about:blank, title: Invalid Request, status: 400, detail: email must be a valid address, instance: 01J8Z3REQ00000000000000001 }
        '403':
          description: Registration is closed (registration_closed).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: registration_closed, status: 403, detail: registration_closed, instance: 01J8Z3REQ00000000000000001 }
        '422':
          description: Password policy or uniqueness failure (weak_password or registration could not be completed).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              examples:
                weak_password:
                  value: { type: about:blank, title: weak_password, status: 422, detail: weak_password, instance: 01J8Z3REQ00000000000000001 }
                duplicate:
                  value: { type: about:blank, title: registration failed, status: 422, detail: registration could not be completed, instance: 01J8Z3REQ00000000000000001 }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify an email address
      description: Use from the link or token delivered by the notification service after registration. It marks the account verified and, in open mode, activates it; approval mode still requires administrator approval.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
            example: { token: verification-token-from-email }
      responses:
        '204': { description: Email verified; no response body. }
        '400':
          description: Token is empty, expired, used, or wrong kind (invalid_token).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: invalid_token, status: 400, detail: invalid_token, instance: 01J8Z3REQ00000000000000001 }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in with a password
      description: Use when an end user needs an access and refresh token pair. A valid account with TOTP enabled receives an MFA challenge instead; clients then call POST /auth/login/mfa.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { username: alice, password: AtLeastTwelve1 }
      responses:
        '200':
          description: Tokens, or an MFA challenge when TOTP is enabled.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - $ref: '#/components/schemas/MfaChallenge'
              examples:
                tokens:
                  value: { access_token: eyJhbGciOiJFZERTQSIs..., refresh_token: refresh-token-opaque, token_type: Bearer, expires_in: 600 }
                mfa:
                  value: { mfa_required: true, mfa_token: eyJhbGciOiJFZERTQSIs... }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Account is pending verification or approval (account_pending).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: account_pending, status: 403, detail: account_pending, instance: 01J8Z3REQ00000000000000001 }
        '423':
          description: Account lockout (account_locked).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: account_locked, status: 423, detail: account_locked, instance: 01J8Z3REQ00000000000000001 }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/login/mfa:
    post:
      tags: [Authentication]
      summary: Complete MFA login
      description: Use after password login returns mfa_required. Submit the short-lived MFA token and either a current TOTP code or one unused backup code; success returns the normal token pair.
      operationId: loginMfa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaLoginRequest' }
            example: { mfa_token: eyJhbGciOiJFZERTQSIs..., code: '123456' }
      responses:
        '200':
          description: MFA accepted and token pair issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              example: { access_token: eyJhbGciOiJFZERTQSIs..., refresh_token: refresh-token-opaque, token_type: Bearer, expires_in: 600 }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423':
          description: Account lockout (account_locked).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: account_locked, status: 423, detail: account_locked, instance: 01J8Z3REQ00000000000000001 }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate a refresh token
      description: Use to obtain a fresh access/refresh pair without prompting the user for a password. Rotation revokes the presented token; reuse or expiry invalidates the request and can revoke its whole family.
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
            example: { refresh_token: refresh-token-opaque }
      responses:
        '200':
          description: Rotated token pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              example: { access_token: eyJhbGciOiJFZERTQSIs..., refresh_token: refresh-token-rotated, token_type: Bearer, expires_in: 600 }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke a refresh-token family
      description: "Use when a client signs out. The operation is intentionally idempotent: missing, malformed, unknown, expired, or already-revoked refresh tokens produce 204 and do not disclose token state."
      operationId: logout
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
            example: { refresh_token: refresh-token-opaque }
      responses:
        '204': { description: Refresh-token family revoked or already absent; no response body. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/introspect:
    post:
      tags: [Authentication]
      summary: Introspect an access or refresh token
      description: Use from a trusted service to check whether a token is active without exposing token material. The caller must authenticate with a service-kind EdDSA bearer token; inactive or missing input still returns 200 with active false.
      operationId: introspect
      security:
        - serviceAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
            example: { token: eyJhbGciOiJFZERTQSIs... }
      responses:
        '200':
          description: Active or inactive token state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntrospectResponse' }
              examples:
                active:
                  value: { active: true, sub: 01J8Z3USER000000000000001, team: 01J8Z3TEAM000000000000001, kind: user, perm_ver: 3, exp: 1760000000 }
                inactive:
                  value: { active: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/client-credentials:
    post:
      tags: [Authentication]
      summary: Obtain a service token
      description: Use for service-to-service authentication. The caller presents the client ID (service user's username) and one-time secret created by POST /users/{id}/credentials with kind service.
      operationId: clientCredentials
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientCredentialsRequest' }
            example: { client_id: orders-service, client_secret: generated-service-secret }
      responses:
        '200':
          description: Service access and refresh token pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              example: { access_token: eyJhbGciOiJFZERTQSIs..., refresh_token: refresh-token-opaque, token_type: Bearer, expires_in: 600 }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423':
          description: Service account lockout (account_locked).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: account_locked, status: 423, detail: account_locked, instance: 01J8Z3REQ00000000000000001 }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/password-reset/request:
    post:
      tags: [Authentication]
      summary: Request a password reset
      description: Use when a user has lost a password. Submit a username or email; the endpoint always returns 204 so callers cannot enumerate accounts. A notification event is emitted only for an active matching account.
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login]
              properties:
                login: { type: string, description: Username or email address }
            example: { login: alice@example.test }
      responses:
        '204': { description: Reset request accepted without revealing account existence; no response body. }
  /auth/password-reset/confirm:
    post:
      tags: [Authentication]
      summary: Confirm a password reset
      description: Use with the one-time token delivered by the notification service. The new password must satisfy policy; success revokes all sessions and clears lockout state.
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, format: password, minLength: 1 }
            example: { token: reset-token-from-email, new_password: NewAtLeastTwelve1 }
      responses:
        '204': { description: Password replaced and sessions revoked; no response body. }
        '400':
          description: Token is missing, invalid, expired, used, or wrong kind (invalid_token).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: invalid_token, status: 400, detail: invalid_token, instance: 01J8Z3REQ00000000000000001 }
        '422':
          description: Replacement fails policy (weak_password).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: weak_password, status: 422, detail: weak_password, instance: 01J8Z3REQ00000000000000001 }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/invite/accept:
    post:
      tags: [Invitations]
      summary: Accept an invitation
      description: Use from an invitation email to set the initial password and activate the invited account. The invitation email is marked verified; display_name is optional.
      operationId: acceptInvitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteAcceptRequest' }
            example: { token: invitation-token-from-email, password: NewAtLeastTwelve1, display_name: Alice Example }
      responses:
        '204': { description: Invitation consumed and account activated; no response body. }
        '400':
          description: Token is missing, invalid, expired, used, cancelled, or wrong kind (invalid_token).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: invalid_token, status: 400, detail: invalid_token, instance: 01J8Z3REQ00000000000000001 }
        '422':
          description: Password fails policy (weak_password).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: weak_password, status: 422, detail: weak_password, instance: 01J8Z3REQ00000000000000001 }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/passkey/login/begin:
    post:
      tags: [Authentication]
      summary: Begin passkey login
      description: Use to begin a WebAuthn assertion. Pass an optional username for a scoped ceremony, or an empty body for discoverable credentials; the browser passes the returned publicKey options to navigator.credentials.get.
      operationId: beginPasskeyLogin
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
            example: { username: alice }
      responses:
        '200':
          description: WebAuthn credential-request options.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnOptions' }
              example:
                publicKey:
                  challenge: base64url-challenge
                  timeout: 300000
                  rpId: localhost
                  allowCredentials:
                    - type: public-key
                      id: base64url-credential-id
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423':
          description: Account lockout (account_locked).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: account_locked, status: 423, detail: account_locked, instance: 01J8Z3REQ00000000000000001 }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/passkey/login/finish:
    post:
      tags: [Authentication]
      summary: Finish passkey login
      description: Use with the browser's PublicKeyCredential assertion response from the begin operation. A valid assertion issues the normal user token pair; failed assertions contribute to account lockout.
      operationId: finishPasskeyLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebAuthnCredential' }
            example:
              id: base64url-credential-id
              rawId: base64url-credential-id
              type: public-key
              response:
                clientDataJSON: base64url-client-data
                authenticatorData: base64url-authenticator-data
                signature: base64url-signature
      responses:
        '200':
          description: User token pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              example: { access_token: eyJhbGciOiJFZERTQSIs..., refresh_token: refresh-token-opaque, token_type: Bearer, expires_in: 600 }
        '400':
          description: Malformed, expired, replayed, or invalid WebAuthn response (invalid WebAuthn response).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Invalid Request, status: 400, detail: invalid WebAuthn response, instance: 01J8Z3REQ00000000000000001 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423':
          description: Account lockout (account_locked).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: account_locked, status: 423, detail: account_locked, instance: 01J8Z3REQ00000000000000001 }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /authz/check:
    post:
      tags: [Authorization]
      summary: Evaluate a permission
      description: Use from a trusted application service to make a single authorization decision for a user and resource context. The caller must use a service-kind bearer token; condition failures fail closed.
      operationId: checkAuthorization
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizationCheckRequest' }
            example:
              subject: 01J8Z3USER000000000000001
              permission: orders:read:team
              context:
                resource:
                  owner_id: 01J8Z3OWNER000000000000001
                  team_id: 01J8Z3TEAM000000000000001
                  attrs: { region: us-east-1 }
      responses:
        '200':
          description: Fail-closed authorization decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationCheckResponse' }
              example: { allow: true, matched: [orders:read:team], reason: permission granted }
        '400':
          description: Malformed JSON or missing subject.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Invalid Request, status: 400, detail: subject is required, instance: 01J8Z3REQ00000000000000001 }
        '401':
          description: A service bearer subject is required.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Unauthorized, status: 401, detail: a service subject is required, instance: 01J8Z3REQ00000000000000001 }
        '404':
          description: User does not exist.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Not Found, status: 404, detail: the requested user was not found, instance: 01J8Z3REQ00000000000000001 }
        '422':
          description: Permission is not resource:action:scope grammar.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Invalid Permission, status: 422, detail: permission must use resource:action:scope grammar, instance: 01J8Z3REQ00000000000000001 }
        '500': { $ref: '#/components/responses/AuthzInternalError' }
  /authz/permissions/{userID}:
    get:
      tags: [Authorization]
      summary: List effective grants
      description: Use from a trusted service to refresh an authorization cache for one user. The service-kind bearer token is required; perm_ver lets consumers invalidate cached grants.
      operationId: listEffectivePermissions
      security:
        - serviceAuth: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: Effective grants and permission version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectivePermissionsResponse' }
              example:
                user_id: 01J8Z3USER000000000000001
                perm_ver: 3
                grants:
                  - key: orders:read:team
                  - key: orders:update:own
                    condition: resource.owner_id == subject.id
        '401': { $ref: '#/components/responses/ServiceUnauthorized' }
        '404':
          description: User does not exist.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Not Found, status: 404, detail: the requested user was not found, instance: 01J8Z3REQ00000000000000001 }
        '500': { $ref: '#/components/responses/AuthzInternalError' }
  /me:
    get:
      tags: [Self-service]
      summary: Get the current profile
      description: Use from a signed-in user interface to display the authenticated user's profile. The identity is always taken from the user bearer subject; credentials and other users' data are never returned.
      operationId: getMyProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
              example: { id: 01J8Z3USER000000000000001, username: alice, email: alice@example.test, display_name: Alice Example, status: active, email_verified_at: '2026-01-01T00:00:00Z', created_at: '2026-01-01T00:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Self-service]
      summary: Update the current display name
      description: Use when a user edits their own display name. Only display_name is accepted; email changes use the two-step email endpoints.
      operationId: patchMyProfile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: { type: string }
            example: { display_name: Alice Smith }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
              example: { id: 01J8Z3USER000000000000001, username: alice, email: alice@example.test, display_name: Alice Smith, status: active, email_verified_at: '2026-01-01T00:00:00Z', created_at: '2026-01-01T00:00:00Z' }
        '400':
          description: Missing display_name or invalid JSON.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Invalid Request, status: 400, detail: display_name is required, instance: 01J8Z3REQ00000000000000001 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Unsupported field.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              examples:
                unsupported:
                  value: { type: about:blank, title: Unsupported Field, status: 422, detail: "unsupported field: email", instance: 01J8Z3REQ00000000000000001 }
                email:
                  value: { type: about:blank, title: Unsupported Field, status: 422, detail: email change is not supported, instance: 01J8Z3REQ00000000000000001 }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Self-service]
      summary: Erase the current account
      description: Use when a user requests irreversible account erasure. The password is rechecked; profile identifiers are anonymized, all credentials and sessions are removed, and the account is disabled.
      operationId: eraseMyAccount
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
            example: { password: CurrentAtLeastTwelve1 }
      responses:
        '204': { description: Account erased and anonymized; no response body. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401':
          description: Password missing or invalid (invalid_credentials).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: invalid_credentials, status: 401, detail: invalid_credentials, instance: 01J8Z3REQ00000000000000001 }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /me/password:
    post:
      tags: [Self-service]
      summary: Change the current password
      description: Use when a signed-in user rotates their password. The current password is verified, the replacement must satisfy policy, and every refresh session (including the current one) is revoked.
      operationId: changeMyPassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
            example: { current_password: OldAtLeastTwelve1, new_password: NewAtLeastTwelve2 }
      responses:
        '200':
          description: Password changed and sessions revoked.
          content:
            application/json:
              schema:
                type: object
                required: [message, sessions_revoked]
                properties:
                  message: { type: string }
                  sessions_revoked: { type: boolean }
              example: { message: password changed; all sessions were revoked; sign in again, sessions_revoked: true }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401':
          description: Invalid current credentials.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: invalid_credentials, status: 401, detail: invalid_credentials, instance: 01J8Z3REQ00000000000000001 }
        '422':
          description: New password fails policy (weak_password).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: weak_password, status: 422, detail: weak_password, instance: 01J8Z3REQ00000000000000001 }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /me/email:
    post:
      tags: [Self-service]
      summary: Request an email change
      description: Use when a user wants to replace their email. The current password is required; a single-use verification token is sent to the new address and the profile remains unchanged until confirmation.
      operationId: requestMyEmailChange
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeRequest' }
            example: { new_email: alice.new@example.test, password: CurrentAtLeastTwelve1 }
      responses:
        '204': { description: Verification message queued; no response body. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401':
          description: Missing or invalid current password (invalid_credentials).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: invalid_credentials, status: 401, detail: invalid_credentials, instance: 01J8Z3REQ00000000000000001 }
        '422':
          description: Invalid address or address already used (invalid_email or email_taken).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              examples:
                invalid_email:
                  value: { type: about:blank, title: invalid_email, status: 422, detail: invalid_email, instance: 01J8Z3REQ00000000000000001 }
                email_taken:
                  value: { type: about:blank, title: email_taken, status: 422, detail: email_taken, instance: 01J8Z3REQ00000000000000001 }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /me/email/confirm:
    post:
      tags: [Self-service]
      summary: Confirm an email change
      description: Use with the one-time token sent to the replacement address. The token is bound to the bearer subject; success updates email_verified_at and the email atomically.
      operationId: confirmMyEmailChange
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
            example: { token: email-change-token-from-email }
      responses:
        '204': { description: Email changed and verified; no response body. }
        '400':
          description: Token is invalid, expired, used, wrong kind, or belongs to another user (invalid_token).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: invalid_token, status: 400, detail: invalid_token, instance: 01J8Z3REQ00000000000000001 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /me/sessions:
    get:
      tags: [Sessions, Self-service]
      summary: List the current user's sessions
      description: Use in account security settings to show active refresh sessions. Returned IDs are opaque token digests and only contain created_at and expires_at.
      operationId: listMySessions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionResponse' }
              example:
                - id: 8d7e5b3a0f6f4e1d...
                  created_at: '2026-01-01T00:00:00Z'
                  expires_at: '2026-01-31T00:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /me/sessions/{id}:
    delete:
      tags: [Sessions, Self-service]
      summary: Revoke one own session
      description: Use when a user signs out another browser or device. Foreign, expired, revoked, or unknown IDs all return the same 404 response.
      operationId: deleteMySession
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '204': { description: Session revoked; no response body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /me/totp/enroll:
    post:
      tags: [Self-service]
      summary: Start TOTP enrollment
      description: Use in security settings to start MFA enrollment. The returned secret and otpauth URL are displayed once; the credential remains pending until a code is confirmed.
      operationId: enrollTotp
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Newly generated pending TOTP secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpResponse' }
              example: { secret: JBSWY3DPEHPK3PXP, otpauth_url: otpauth://totp/teamusers:alice?secret=JBSWY3DPEHPK3PXP&issuer=teamusers }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: TOTP is already enabled (totp_already_enabled).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: totp_already_enabled, status: 409, detail: totp_already_enabled, instance: 01J8Z3REQ00000000000000001 }
        '500': { $ref: '#/components/responses/InternalError' }
  /me/totp/confirm:
    post:
      tags: [Self-service]
      summary: Confirm TOTP enrollment
      description: Use after scanning the enrollment QR code. Submit the current six-digit code; the pending secret becomes active and ten one-time backup codes are returned.
      operationId: confirmTotp
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 6, maxLength: 6 }
            example: { code: '123456' }
      responses:
        '200':
          description: Backup codes issued once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupCodesResponse' }
              example: { backup_codes: [abcd-1234-efgh-5678, 9ijk-lmno-0123-pqrs, 1111-2222-3333-4444] }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: TOTP became enabled concurrently (totp_already_enabled).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: totp_already_enabled, status: 409, detail: totp_already_enabled, instance: 01J8Z3REQ00000000000000001 }
        '500': { $ref: '#/components/responses/InternalError' }
  /me/totp/backup-codes:
    post:
      tags: [Self-service]
      summary: Regenerate TOTP backup codes
      description: Use when backup codes are exhausted or suspected exposed. The current password and an active TOTP enrollment are required; old codes are replaced atomically.
      operationId: regenerateTotpBackupCodes
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
            example: { password: CurrentAtLeastTwelve1 }
      responses:
        '200':
          description: New backup codes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupCodesResponse' }
              example: { backup_codes: [abcd-1234-efgh-5678, 9ijk-lmno-0123-pqrs, 1111-2222-3333-4444] }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401':
          description: Password is missing or invalid (invalid_credentials).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: invalid_credentials, status: 401, detail: invalid_credentials, instance: 01J8Z3REQ00000000000000001 }
        '404':
          description: TOTP is not enrolled (mfa_not_enrolled).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: mfa_not_enrolled, status: 404, detail: mfa_not_enrolled, instance: 01J8Z3REQ00000000000000001 }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /me/totp:
    delete:
      tags: [Self-service]
      summary: Disable TOTP
      description: Use when a user removes MFA. Submit a current TOTP code or unused backup code; active TOTP, pending TOTP, and backup credentials are deleted.
      operationId: deleteTotp
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
            example: { code: '123456' }
      responses:
        '204': { description: TOTP and backup credentials deleted; no response body. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /me/passkeys/register/begin:
    post:
      tags: [Self-service]
      summary: Begin passkey registration
      description: Use from a signed-in browser to add a WebAuthn credential. The browser passes the returned publicKey options to navigator.credentials.create; the ceremony expires after five minutes.
      operationId: beginPasskeyRegistration
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: WebAuthn credential-creation options.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnOptions' }
              example:
                publicKey:
                  rp: { name: teamusers, id: localhost }
                  user: { name: alice, displayName: Alice Example, id: base64url-user-handle }
                  challenge: base64url-challenge
                  pubKeyCredParams: [{ type: public-key, alg: -7 }]
                  attestation: none
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /me/passkeys/register/finish:
    post:
      tags: [Self-service]
      summary: Finish passkey registration
      description: Use with the browser's PublicKeyCredential creation response. A valid response consumes the single-use challenge and stores only the credential material required for WebAuthn.
      operationId: finishPasskeyRegistration
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebAuthnCredential' }
            example:
              id: base64url-credential-id
              rawId: base64url-credential-id
              type: public-key
              response: { clientDataJSON: base64url-client-data, attestationObject: base64url-attestation }
      responses:
        '204': { description: Passkey registered; no response body. }
        '400':
          description: Malformed, expired, replayed, or invalid WebAuthn response (invalid WebAuthn response).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Invalid Request, status: 400, detail: invalid WebAuthn response, instance: 01J8Z3REQ00000000000000001 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /me/passkeys:
    get:
      tags: [Self-service]
      summary: List own passkeys
      description: Use in account security settings to show registered passkey identifiers. Public keys and attestation data are never returned.
      operationId: listMyPasskeys
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Passkey identifiers and enrollment time.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Passkey' }
              example: [{ id: base64url-credential-id, created_at: '2026-01-01T00:00:00Z' }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /me/passkeys/{credID}:
    delete:
      tags: [Self-service]
      summary: Delete one own passkey
      description: Use to remove a passkey by its unpadded base64url credential ID. Unknown IDs return the same not-found problem regardless of ownership.
      operationId: deleteMyPasskey
      security: [{ bearerAuth: [] }]
      parameters:
        - name: credID
          in: path
          required: true
          schema: { type: string }
          example: base64url-credential-id
      responses:
        '204': { description: Passkey deleted; no response body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Passkey was not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Not Found, status: 404, detail: the requested passkey was not found, instance: 01J8Z3REQ00000000000000001 }
        '500': { $ref: '#/components/responses/InternalError' }
  /me/export:
    get:
      tags: [Self-service]
      summary: Export current account data
      description: Use to satisfy a data portability request. The response is an attachment containing profile, memberships, effective permissions, active sessions, and MFA/passkey counts; secrets and credential material are excluded.
      operationId: exportMyProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: JSON account export attachment.
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="user-export.json"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileExport' }
              example:
                profile: { id: 01J8Z3USER000000000000001, username: alice, email: alice@example.test, display_name: Alice Example, status: active, email_verified_at: '2026-01-01T00:00:00Z', created_at: '2026-01-01T00:00:00Z' }
                memberships: [{ group_id: 01J8Z3GROUP000000000000001, team_id: 01J8Z3TEAM000000000000001 }]
                effective_permissions: [orders:read:team]
                active_sessions: [{ id: 8d7e5b3a0f6f4e1d..., created_at: '2026-01-01T00:00:00Z', expires_at: '2026-01-31T00:00:00Z' }]
                totp_enabled: false
                passkey_count: 0
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /users:
    get:
      tags: [Users]
      summary: List users
      description: Use from an administrator console to page through all users. Requires an active user bearer with iam:users:any; cursor is an opaque ULID returned by the previous page.
      operationId: listUsers
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor page of users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
              example:
                items: [{ id: 01J8Z3USER000000000000001, username: alice, email: alice@example.test, display_name: Alice Example, status: active, perm_ver: 3, failed_logins: 0, email_verified_at: '2026-01-01T00:00:00Z', created_at: '2026-01-01T00:00:00Z', updated_at: '2026-01-01T00:00:00Z' }]
                next_cursor: ''
        '400': { $ref: '#/components/responses/InvalidPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Users]
      summary: Create a user
      description: Use from an administrator or provisioning workflow to create an active user. Password and initial_password are optional; password wins when both are supplied.
      operationId: createUser
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
            example: { username: alice, email: alice@example.test, display_name: Alice Example, password: AtLeastTwelve1 }
      responses:
        '201':
          description: Created user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: 01J8Z3USER000000000000001, username: alice, email: alice@example.test, display_name: Alice Example, status: active, perm_ver: 0, failed_logins: 0, created_at: '2026-01-01T00:00:00Z', updated_at: '2026-01-01T00:00:00Z' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Password fails policy (weak_password).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: weak_password, status: 422, detail: weak_password, instance: 01J8Z3REQ00000000000000001 }
        '500': { $ref: '#/components/responses/InternalError' }
  /users/batch:
    post:
      tags: [Users]
      summary: Enable or disable users in batches
      description: Use for administrative bulk status changes. Up to 500 IDs are processed independently; each result records success or invalid_id, not_found, or operation_failed.
      operationId: batchUserStatus
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserBatchRequest' }
            example: { ids: [01J8Z3USER000000000000001, 01J8Z3USER000000000000002], op: disable }
      responses:
        '200':
          description: Per-user results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResultsResponse' }
              example: { results: [{ id: 01J8Z3USER000000000000001, ok: true }, { id: 01J8Z3USER000000000000002, ok: false, error: not_found }] }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '422':
          description: Invalid operation or more than 500 IDs.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              examples:
                operation:
                  value: { type: about:blank, title: Invalid Operation, status: 422, detail: op must be disable or enable, instance: 01J8Z3REQ00000000000000001 }
                too_many:
                  value: { type: about:blank, title: Too Many Items, status: 422, detail: a maximum of 500 ids is allowed, instance: 01J8Z3REQ00000000000000001 }
        '500': { $ref: '#/components/responses/InternalError' }
  /users/import:
    post:
      tags: [Users]
      summary: Import users from CSV
      description: Use for bulk provisioning from an administrator export. Send text/csv with exactly username,email,display_name,password columns and at most 500 data rows; each row is reported independently.
      operationId: importUsers
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, format: binary }
            example: |-
              username,email,display_name,password
              alice,alice@example.test,Alice Example,AtLeastTwelve1
              bob,bob@example.test,Bob Example,AnotherTwelve2
      responses:
        '200':
          description: Per-row import results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResultsResponse' }
              example: { results: [{ row: 2, username: alice, ok: true, id: 01J8Z3USER000000000000001 }, { row: 3, username: bob, ok: false, error: weak_password }] }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '415':
          description: Content-Type is not text/csv.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Unsupported Media Type, status: 415, detail: Content-Type must be text/csv, instance: 01J8Z3REQ00000000000000001 }
        '422':
          description: CSV header, row shape, or row count is invalid (Invalid CSV).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Invalid CSV, status: 422, detail: CSV header must be username,email,display_name,password, instance: 01J8Z3REQ00000000000000001 }
        '500': { $ref: '#/components/responses/InternalError' }
  /users/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      tags: [Users]
      summary: Get a user
      description: Use to retrieve one administrative user record by ULID. Requires iam:users:any.
      operationId: getUser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: 01J8Z3USER000000000000001, username: alice, email: alice@example.test, display_name: Alice Example, status: active, perm_ver: 3, failed_logins: 0, created_at: '2026-01-01T00:00:00Z', updated_at: '2026-01-01T00:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Users]
      summary: Update a user
      description: Use for administrative profile or status changes. At least one of username, email, display_name, and status is required; status may be active or disabled.
      operationId: patchUser
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchUserRequest' }
            example: { display_name: Alice Smith, status: active }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: 01J8Z3USER000000000000001, username: alice, email: alice@example.test, display_name: Alice Smith, status: active, perm_ver: 3, failed_logins: 0, created_at: '2026-01-01T00:00:00Z', updated_at: '2026-01-01T00:00:00Z' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Users]
      summary: Delete a user
      description: Use for an administrative hard deletion. Cascaded records are removed and the operation is audited; prefer account erasure for self-service privacy requests.
      operationId: deleteUser
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: User deleted; no response body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /users/{id}/disable:
    post:
      tags: [Users]
      summary: Disable a user
      description: Use as a dedicated administrative lock switch. It resets lockout state, revokes sessions, invalidates permissions, and emits the same lifecycle events as a disabled status update.
      operationId: disableUser
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200':
          description: Disabled user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: 01J8Z3USER000000000000001, username: alice, email: alice@example.test, display_name: Alice Example, status: disabled, perm_ver: 4, failed_logins: 0, created_at: '2026-01-01T00:00:00Z', updated_at: '2026-01-01T00:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /users/{id}/approve:
    post:
      tags: [Users]
      summary: Approve a pending user
      description: Use in approval registration mode after the user has verified email. The administrator's user bearer is recorded as approver; unverified accounts return email_not_verified.
      operationId: approveUser
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200':
          description: Approved active user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: 01J8Z3USER000000000000001, username: alice, email: alice@example.test, display_name: Alice Example, status: active, perm_ver: 1, failed_logins: 0, email_verified_at: '2026-01-01T00:00:00Z', approved_at: '2026-01-02T00:00:00Z', approved_by: 01J8ZADMIN000000000000001, created_at: '2026-01-01T00:00:00Z', updated_at: '2026-01-02T00:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Email is not verified (email_not_verified).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Invalid Request, status: 422, detail: email_not_verified, instance: 01J8Z3REQ00000000000000001 }
        '500': { $ref: '#/components/responses/InternalError' }
  /users/{id}/credentials:
    post:
      tags: [Users]
      summary: Create or rotate a user credential
      description: Use to provision a password credential or a service credential. Service secrets are generated and returned exactly once; password hashes are never returned.
      operationId: createUserCredential
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCredentialRequest' }
            examples:
              password: { value: { kind: password, password: AtLeastTwelve1 } }
              service: { value: { kind: service } }
      responses:
        '201':
          description: Credential metadata; service includes one-time secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialCreatedResponse' }
              examples:
                password: { value: { user_id: 01J8Z3USER000000000000001, username: alice, kind: password } }
                service: { value: { user_id: 01J8Z3USER000000000000002, username: orders-service, kind: service, client_id: orders-service, client_secret: generated-once-secret } }
        '400':
          description: Invalid kind or missing password for kind=password.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Invalid Request, status: 400, detail: kind must be password or service, instance: 01J8Z3REQ00000000000000001 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Password fails policy (weak_password).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: weak_password, status: 422, detail: weak_password, instance: 01J8Z3REQ00000000000000001 }
        '500': { $ref: '#/components/responses/InternalError' }
  /users/{id}/totp:
    delete:
      tags: [Users]
      summary: Reset a user's TOTP
      description: Use for administrative recovery when a user loses MFA access. It deletes active, pending, and backup-code credentials without requiring the user's TOTP code.
      operationId: deleteUserTotp
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '204': { description: TOTP credentials deleted; no response body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /users/{id}/sessions:
    get:
      tags: [Sessions, Users]
      summary: List a user's sessions
      description: Use for administrative security review. Requires iam:sessions:any and returns only active session IDs and timestamps, never client metadata or refresh tokens.
      operationId: listUserSessions
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200':
          description: Active sessions.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SessionResponse' } }
              example: [{ id: 8d7e5b3a0f6f4e1d..., created_at: '2026-01-01T00:00:00Z', expires_at: '2026-01-31T00:00:00Z' }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Sessions, Users]
      summary: Revoke every session for a user
      description: Use for incident response or after an administrative password reset. It revokes all refresh sessions for the target user and returns no body.
      operationId: deleteAllUserSessions
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '204': { description: All sessions revoked; no response body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /users/{id}/sessions/{sid}:
    delete:
      tags: [Sessions, Users]
      summary: Revoke one user's session
      description: Use to revoke one device session during security review. The session must belong to the path user; foreign IDs return not_found.
      operationId: deleteUserSession
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: sid
          in: path
          required: true
          schema: { type: string }
          description: Opaque refresh-token digest session ID.
          example: 8d7e5b3a0f6f4e1d...
      responses:
        '204': { description: Session revoked; no response body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /teams:
    get:
      tags: [Teams]
      summary: List teams
      description: Use from an administrator console to page through teams. Requires iam:teams:any.
      operationId: listTeams
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: Cursor page of teams.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPage' }
              example: { items: [{ id: 01J8Z3TEAM000000000000001, slug: acme, name: Acme, status: active, created_at: '2026-01-01T00:00:00Z' }], next_cursor: '' }
        '400': { $ref: '#/components/responses/InvalidPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Teams]
      summary: Create a team
      description: Use when provisioning a new tenant or workspace. Slug and name are required; status defaults to active.
      operationId: createTeam
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamCreateRequest' }
            example: { slug: acme, name: Acme, status: active }
      responses:
        '201':
          description: Created team.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
              example: { id: 01J8Z3TEAM000000000000001, slug: acme, name: Acme, status: active, created_at: '2026-01-01T00:00:00Z' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /teams/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      tags: [Teams]
      summary: Get a team
      description: Use to retrieve one team by ULID for an administrative view or downstream provisioning step.
      operationId: getTeam
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Team record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
              example: { id: 01J8Z3TEAM000000000000001, slug: acme, name: Acme, status: active, created_at: '2026-01-01T00:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Teams]
      summary: Update a team
      description: Use to rename or change a team's slug/status. At least one field is required; status must be active or disabled.
      operationId: patchTeam
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamPatchRequest' }
            example: { name: Acme Europe, status: active }
      responses:
        '200':
          description: Updated team.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
              example: { id: 01J8Z3TEAM000000000000001, slug: acme, name: Acme Europe, status: active, created_at: '2026-01-01T00:00:00Z' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Teams]
      summary: Delete a team
      description: Use to remove a team and its dependent administrative records. The operation invalidates affected permission versions and is audited.
      operationId: deleteTeam
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Team deleted; no response body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /groups:
    get:
      tags: [Groups]
      summary: List groups in a team
      description: Use to page through groups for one team. team_id is required because groups are team-scoped; requires iam:groups:any.
      operationId: listGroups
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TeamIDQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor page of groups.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupPage' }
              example: { items: [{ id: 01J8Z3GROUP000000000000001, team_id: 01J8Z3TEAM000000000000001, name: backend }], next_cursor: '' }
        '400': { $ref: '#/components/responses/InvalidPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Groups]
      summary: Create a group
      description: Use to create a team-scoped group that can receive memberships and role bindings.
      operationId: createGroup
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupCreateRequest' }
            example: { team_id: 01J8Z3TEAM000000000000001, name: backend }
      responses:
        '201':
          description: Created group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
              example: { id: 01J8Z3GROUP000000000000001, team_id: 01J8Z3TEAM000000000000001, name: backend }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /groups/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      tags: [Groups]
      summary: Get a group
      description: Use to retrieve one group by ULID, including its owning team ID.
      operationId: getGroup
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Group record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
              example: { id: 01J8Z3GROUP000000000000001, team_id: 01J8Z3TEAM000000000000001, name: backend }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Groups]
      summary: Update a group
      description: Use to rename a group or move it to another team. At least one of team_id and name is required; memberships are updated when the team changes.
      operationId: patchGroup
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupPatchRequest' }
            example: { name: platform-backend }
      responses:
        '200':
          description: Updated group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
              example: { id: 01J8Z3GROUP000000000000001, team_id: 01J8Z3TEAM000000000000001, name: platform-backend }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Groups]
      summary: Delete a group
      description: Use to remove a group and its memberships. Affected users' permission versions are invalidated.
      operationId: deleteGroup
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Group deleted; no response body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /groups/{id}/members:
    put:
      tags: [Groups]
      summary: Add or replace a group membership
      description: Use to add a user to a group or update that membership's expiry. The operation is idempotent and returns the complete membership record.
      operationId: putGroupMember
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipRequest' }
            example: { user_id: 01J8Z3USER000000000000001, expires_at: '2026-02-01T00:00:00Z' }
      responses:
        '200':
          description: Membership.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
              example: { team_id: 01J8Z3TEAM000000000000001, group_id: 01J8Z3GROUP000000000000001, user_id: 01J8Z3USER000000000000001, expires_at: '2026-02-01T00:00:00Z' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Groups]
      summary: Remove a group member by request body
      description: Use to remove a membership when the client has the group ID but sends the user ID as JSON. The path variant with userID is equivalent and is preferred for idempotent URL-based clients.
      operationId: deleteGroupMemberBody
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string }
            example: { user_id: 01J8Z3USER000000000000001 }
      responses:
        '204': { description: Membership deleted; no response body. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /groups/{id}/members/{userID}:
    delete:
      tags: [Groups]
      summary: Remove a group member
      description: Use to remove a membership by group and user ULIDs. Unknown group, user, or membership returns a generic not-found problem.
      operationId: deleteGroupMember
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: userID
          in: path
          required: true
          schema: { type: string }
          example: 01J8Z3USER000000000000001
      responses:
        '204': { description: Membership deleted; no response body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /groups/{id}/members/batch:
    post:
      tags: [Groups]
      summary: Add group members in a batch
      description: Use to bulk-populate a group. Up to 500 user IDs are processed independently; duplicate rows report already_member and unknown users report not_found.
      operationId: batchGroupMembers
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupMembersBatchRequest' }
            example: { user_ids: [01J8Z3USER000000000000001, 01J8Z3USER000000000000002] }
      responses:
        '200':
          description: Per-user membership results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResultsResponse' }
              example: { results: [{ id: 01J8Z3USER000000000000001, ok: true }, { id: 01J8Z3USER000000000000002, ok: false, error: already_member }] }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: More than 500 IDs.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Too Many Items, status: 422, detail: a maximum of 500 user_ids is allowed, instance: 01J8Z3REQ00000000000000001 }
        '500': { $ref: '#/components/responses/InternalError' }
  /roles:
    get:
      tags: [Roles]
      summary: List roles
      description: Use to page through platform or team roles. team_id optionally filters by team; omitted or null-scoped roles are platform roles.
      operationId: listRoles
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TeamIDOptionalQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor page of roles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolePage' }
              example: { items: [{ id: 01J8Z3ROLE000000000000001, team_id: 01J8Z3TEAM000000000000001, name: operator }], next_cursor: '' }
        '400': { $ref: '#/components/responses/InvalidPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Roles]
      summary: Create a role
      description: Use to define a platform-wide or team-scoped role. team_id may be a ULID or JSON null.
      operationId: createRole
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleCreateRequest' }
            examples:
              team: { value: { team_id: 01J8Z3TEAM000000000000001, name: operator } }
              platform: { value: { team_id: null, name: platform-auditor } }
      responses:
        '201':
          description: Created role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
              example: { id: 01J8Z3ROLE000000000000001, team_id: 01J8Z3TEAM000000000000001, name: operator }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /roles/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      tags: [Roles]
      summary: Get a role
      description: Use to retrieve one role and its scope before binding or changing permissions.
      operationId: getRole
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Role record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
              example: { id: 01J8Z3ROLE000000000000001, team_id: 01J8Z3TEAM000000000000001, name: operator }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Roles]
      summary: Update a role
      description: Use to rename a role or change its team scope. At least one field is required; team-scoped administrators cannot change team_id outside their scope.
      operationId: patchRole
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolePatchRequest' }
            example: { name: senior-operator }
      responses:
        '200':
          description: Updated role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
              example: { id: 01J8Z3ROLE000000000000001, team_id: 01J8Z3TEAM000000000000001, name: senior-operator }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Roles]
      summary: Delete a role
      description: Use to remove a role and all of its bindings. Affected users' permission versions are invalidated.
      operationId: deleteRole
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Role deleted; no response body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /roles/{id}/permissions:
    put:
      tags: [Roles, Permissions]
      summary: Set permissions on a role
      description: Use to replace the complete permission set of a role. permission_keys is canonical; permissions is accepted as a legacy alias when permission_keys is absent. Every key must already be registered.
      operationId: setRolePermissions
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRolePermissionsRequest' }
            example: { permission_keys: [orders:read:team, orders:update:own] }
      responses:
        '200':
          description: Replaced role permission keys.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolePermissionsResponse' }
              example: { role_id: 01J8Z3ROLE000000000000001, permissions: [orders:read:team, orders:update:own] }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Invalid permission grammar or unregistered permission.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              examples:
                grammar:
                  value: { type: about:blank, title: Invalid Permission, status: 422, detail: permission must use resource:action:scope grammar, instance: 01J8Z3REQ00000000000000001 }
                unregistered:
                  value: { type: about:blank, title: Invalid Request, status: 422, detail: "permission is not registered: orders:read:team", instance: 01J8Z3REQ00000000000000001 }
        '500': { $ref: '#/components/responses/InternalError' }
  /permissions:
    get:
      tags: [Permissions]
      summary: List registered permissions
      description: Use to populate policy editors and validate role changes. Requires iam:permissions:any and returns cursor pages.
      operationId: listPermissions
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: Cursor page of registered permissions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionPage' }
              example: { items: [{ key: orders:read:team, description: Read orders, registered_by: orders-service, created_at: '2026-01-01T00:00:00Z' }], next_cursor: '' }
        '400': { $ref: '#/components/responses/InvalidPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Permissions]
      summary: Register or update a permission
      description: Use when an application service introduces a permission key. Keys must follow resource:action:scope grammar; registration is an upsert and increments the global permission registry version.
      operationId: registerPermission
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionRequest' }
            example: { key: orders:read:team, description: Read orders in a team, registered_by: orders-service }
      responses:
        '201':
          description: Registered permission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Permission' }
              example: { key: orders:read:team, description: Read orders in a team, registered_by: orders-service, created_at: '2026-01-01T00:00:00Z' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '422':
          description: Invalid permission grammar.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Invalid Permission, status: 422, detail: permission must use resource:action:scope grammar, instance: 01J8Z3REQ00000000000000001 }
        '500': { $ref: '#/components/responses/InternalError' }
  /bindings:
    get:
      tags: [Bindings]
      summary: List role bindings for a subject
      description: Use to inspect a user's or group's role assignments. Both subject_kind and subject_id are required; cursor pages are scoped to that subject.
      operationId: listBindings
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SubjectKindQuery'
        - $ref: '#/components/parameters/SubjectIDQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor page of role bindings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleBindingPage' }
              example: { items: [{ id: 01J8Z3BIND000000000000001, team_id: 01J8Z3TEAM000000000000001, role_id: 01J8Z3ROLE000000000000001, subject_kind: user, subject_id: 01J8Z3USER000000000000001, condition: resource.team_id == subject.team_id, expires_at: '2026-02-01T00:00:00Z' }], next_cursor: '' }
        '400':
          description: Missing or invalid subject query parameters.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Invalid Request, status: 400, detail: subject_kind and subject_id are required, instance: 01J8Z3REQ00000000000000001 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Bindings]
      summary: Create a role binding
      description: Use to assign a role to a user or group. Optional team_id, condition, and expires_at constrain scope; conditions are compiled before persistence and fail closed at evaluation time.
      operationId: createBinding
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BindingRequest' }
            example: { team_id: 01J8Z3TEAM000000000000001, role_id: 01J8Z3ROLE000000000000001, subject_kind: user, subject_id: 01J8Z3USER000000000000001, condition: resource.team_id == subject.team_id, expires_at: '2026-02-01T00:00:00Z' }
      responses:
        '201':
          description: Created role binding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleBinding' }
              example: { id: 01J8Z3BIND000000000000001, team_id: 01J8Z3TEAM000000000000001, role_id: 01J8Z3ROLE000000000000001, subject_kind: user, subject_id: 01J8Z3USER000000000000001, condition: resource.team_id == subject.team_id, expires_at: '2026-02-01T00:00:00Z' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Binding condition could not be compiled.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Invalid Condition, status: 422, detail: condition could not be compiled, instance: 01J8Z3REQ00000000000000001 }
        '500': { $ref: '#/components/responses/InternalError' }
  /bindings/{id}:
    delete:
      tags: [Bindings]
      summary: Delete a role binding
      description: Use to remove a role assignment. Affected users' permission versions are invalidated and the deletion is audited.
      operationId: deleteBinding
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '204': { description: Binding deleted; no response body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /audit:
    get:
      tags: [Audit]
      summary: List audit entries
      description: Use for compliance review and incident investigation. The append-only log supports an optional team filter and a numeric cursor; cursor 0 means the beginning and next_cursor 0 means no next page.
      operationId: listAudit
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TeamIDOptionalQuery'
        - $ref: '#/components/parameters/AuditCursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor page of audit entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
              example: { items: [{ id: 1, team_id: 01J8Z3TEAM000000000000001, actor_id: 01J8Z3ADMIN000000000000001, action: user.created, target: 01J8Z3USER000000000000001, diff: { status: active }, request_id: req-01J8Z3, at: '2026-01-01T00:00:00Z' }], next_cursor: 0 }
        '400':
          description: Invalid non-negative integer cursor or limit.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Invalid Request, status: 400, detail: cursor must be a non-negative integer, instance: 01J8Z3REQ00000000000000001 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '500': { $ref: '#/components/responses/InternalError' }
  /invitations:
    post:
      tags: [Invitations]
      summary: Create an invitation
      description: Use from an administrator provisioning workflow to create an invited user and send a one-time invitation token. Username and email must be unique; the plaintext token is emitted only through notification delivery.
      operationId: createInvitation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationRequest' }
            example: { email: alice@example.test, username: alice, display_name: Alice Example }
      responses:
        '201':
          description: Invited user placeholder.
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string }
                  status: { type: string, example: invited }
              example: { id: 01J8Z3USER000000000000001, status: invited }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '422':
          description: Username or email already exists.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Invalid Request, status: 422, detail: username or email already exists, instance: 01J8Z3REQ00000000000000001 }
        '500': { $ref: '#/components/responses/InternalError' }
  /invitations/{userID}/resend:
    post:
      tags: [Invitations]
      summary: Resend an invitation
      description: Use when an invited user did not receive the original message. The previous invitation token is invalidated and a fresh seven-day token is emitted through notifications.
      operationId: resendInvitation
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserID' }]
      responses:
        '204': { description: Invitation token rotated; no response body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Target is not currently invited (account is not invited).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Invalid Request, status: 422, detail: account is not invited, instance: 01J8Z3REQ00000000000000001 }
        '500': { $ref: '#/components/responses/InternalError' }
  /invitations/{userID}:
    delete:
      tags: [Invitations]
      summary: Cancel an invitation
      description: Use when an invitation must be withdrawn before acceptance. The target must remain invited; cancellation deletes the user and cascaded records.
      operationId: cancelInvitation
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserID' }]
      responses:
        '204': { description: Invitation cancelled; no response body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientPermissions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Target is not currently invited (account is not invited).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: about:blank, title: Invalid Request, status: 422, detail: account is not invited, instance: 01J8Z3REQ00000000000000001 }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: EdDSA-JWT
      description: EdDSA-signed access JWT. Claims include iss=teamusers, sub, kind=user|service, perm_ver, iat, exp, and optionally team.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: EdDSA-JWT
      description: EdDSA access JWT whose kind claim is service. Used for service-only introspection and authorization endpoints.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, description: ULID }
      example: 01J8Z3USER000000000000001
    UserID:
      name: userID
      in: path
      required: true
      schema: { type: string, description: ULID }
      example: 01J8Z3USER000000000000001
    SessionID:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Opaque refresh-token digest.
      example: 8d7e5b3a0f6f4e1d...
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Opaque ULID cursor returned as next_cursor. Empty means the first page.
      example: 01J8Z3USER000000000000099
    AuditCursor:
      name: cursor
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 0, default: 0 }
      description: Numeric audit entry ID cursor.
      example: 0
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 100 }
      description: Positive page size. The store caps the effective page at 1000.
      example: 100
    TeamIDQuery:
      name: team_id
      in: query
      required: true
      schema: { type: string }
      description: Team ULID; required for group listing.
      example: 01J8Z3TEAM000000000000001
    TeamIDOptionalQuery:
      name: team_id
      in: query
      required: false
      schema: { type: string }
      description: Optional team ULID filter.
      example: 01J8Z3TEAM000000000000001
    SubjectKindQuery:
      name: subject_kind
      in: query
      required: true
      schema: { type: string, enum: [user, group] }
      example: user
    SubjectIDQuery:
      name: subject_id
      in: query
      required: true
      schema: { type: string }
      example: 01J8Z3USER000000000000001
  responses:
    Unauthorized:
      description: Missing, invalid, stale, or wrong-kind bearer token (authentication failed).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { type: about:blank, title: Unauthorized, status: 401, detail: authentication failed, instance: 01J8Z3REQ00000000000000001 }
    ServiceUnauthorized:
      description: Missing or invalid service bearer token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { type: about:blank, title: Unauthorized, status: 401, detail: authentication failed, instance: 01J8Z3REQ00000000000000001 }
    InsufficientPermissions:
      description: User bearer is valid but lacks the required iam:* permission, or is a service subject.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { type: about:blank, title: Forbidden, status: 403, detail: insufficient_permissions, instance: 01J8Z3REQ00000000000000001 }
    InvalidRequest:
      description: Malformed JSON or invalid request fields.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { type: about:blank, title: Invalid Request, status: 400, detail: request body must be valid JSON, instance: 01J8Z3REQ00000000000000001 }
    InvalidPage:
      description: Invalid cursor or limit.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { type: about:blank, title: Invalid Request, status: 400, detail: limit must be a positive integer, instance: 01J8Z3REQ00000000000000001 }
    NotFound:
      description: Resource was not found.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { type: about:blank, title: Not Found, status: 404, detail: the requested resource was not found, instance: 01J8Z3REQ00000000000000001 }
    Conflict:
      description: Resource already exists.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { type: about:blank, title: Conflict, status: 409, detail: the resource already exists, instance: 01J8Z3REQ00000000000000001 }
    RateLimited:
      description: Authentication rate limit or Argon2 worker capacity exhausted.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { type: about:blank, title: Too Many Requests, status: 429, detail: authentication temporarily busy, instance: 01J8Z3REQ00000000000000001 }
    InternalError:
      description: Internal authentication or database failure.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { type: about:blank, title: Internal Server Error, status: 500, detail: authentication service unavailable, instance: 01J8Z3REQ00000000000000001 }
    AuthzInternalError:
      description: Authorization resolver or database failure.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { type: about:blank, title: Internal Server Error, status: 500, detail: authorization service unavailable, instance: 01J8Z3REQ00000000000000001 }
  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457 problem+json document. Error codes are emitted in title and/or detail; instance is the request ID when available.
      required: [type, title, status]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Invalid Request }
        status: { type: integer, format: int32, minimum: 400, maximum: 599, example: 400 }
        detail: { type: string, example: invalid_token }
        instance: { type: string, example: 01J8Z3REQ00000000000000001 }
      example: { type: about:blank, title: Invalid Request, status: 400, detail: invalid_token, instance: 01J8Z3REQ00000000000000001 }
    User:
      type: object
      required: [id, username, display_name, status, perm_ver, failed_logins, created_at, updated_at]
      properties:
        id: { type: string, description: ULID }
        username: { type: string }
        email: { type: [string, 'null'], format: email }
        display_name: { type: string }
        status: { type: string, enum: [pending, invited, active, disabled] }
        perm_ver: { type: integer, format: int64 }
        failed_logins: { type: integer, format: int32 }
        locked_until: { type: [string, 'null'], format: date-time }
        email_verified_at: { type: [string, 'null'], format: date-time }
        approved_at: { type: [string, 'null'], format: date-time }
        approved_by: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      example: { id: 01J8Z3USER000000000000001, username: alice, email: alice@example.test, display_name: Alice Example, status: active, perm_ver: 3, failed_logins: 0, created_at: '2026-01-01T00:00:00Z', updated_at: '2026-01-01T00:00:00Z' }
    Profile:
      type: object
      required: [id, username, display_name, status, created_at]
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: [string, 'null'], format: email }
        display_name: { type: string }
        status: { type: string }
        email_verified_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
      example: { id: 01J8Z3USER000000000000001, username: alice, email: alice@example.test, display_name: Alice Example, status: active, email_verified_at: '2026-01-01T00:00:00Z', created_at: '2026-01-01T00:00:00Z' }
    Team:
      type: object
      required: [id, slug, name, status, created_at]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
      example: { id: 01J8Z3TEAM000000000000001, slug: acme, name: Acme, status: active, created_at: '2026-01-01T00:00:00Z' }
    Group:
      type: object
      required: [id, team_id, name]
      properties:
        id: { type: string }
        team_id: { type: string }
        name: { type: string }
      example: { id: 01J8Z3GROUP000000000000001, team_id: 01J8Z3TEAM000000000000001, name: backend }
    Membership:
      type: object
      required: [team_id, group_id, user_id]
      properties:
        team_id: { type: string }
        group_id: { type: string }
        user_id: { type: string }
        expires_at: { type: [string, 'null'], format: date-time }
      example: { team_id: 01J8Z3TEAM000000000000001, group_id: 01J8Z3GROUP000000000000001, user_id: 01J8Z3USER000000000000001, expires_at: '2026-02-01T00:00:00Z' }
    Permission:
      type: object
      required: [key, description, registered_by, created_at]
      properties:
        key: { type: string, pattern: '^[^:]+:[^:]+:(any|team|own)$' }
        description: { type: string }
        registered_by: { type: string }
        created_at: { type: string, format: date-time }
      example: { key: orders:read:team, description: Read orders, registered_by: orders-service, created_at: '2026-01-01T00:00:00Z' }
    Role:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        team_id: { type: [string, 'null'] }
        name: { type: string }
      example: { id: 01J8Z3ROLE000000000000001, team_id: 01J8Z3TEAM000000000000001, name: operator }
    RoleBinding:
      type: object
      required: [id, role_id, subject_kind, subject_id]
      properties:
        id: { type: string }
        team_id: { type: [string, 'null'] }
        role_id: { type: string }
        subject_kind: { type: string, enum: [user, group] }
        subject_id: { type: string }
        condition: { type: [string, 'null'] }
        expires_at: { type: [string, 'null'], format: date-time }
      example: { id: 01J8Z3BIND000000000000001, team_id: 01J8Z3TEAM000000000000001, role_id: 01J8Z3ROLE000000000000001, subject_kind: user, subject_id: 01J8Z3USER000000000000001, condition: resource.team_id == subject.team_id, expires_at: '2026-02-01T00:00:00Z' }
    Session:
      type: object
      required: [id, user_id, family_id, client_meta, created_at, expires_at, family_not_after]
      properties:
        id: { type: string }
        user_id: { type: string }
        family_id: { type: string }
        client_meta: {}
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        family_not_after: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        revoke_reason: { type: [string, 'null'] }
    SessionResponse:
      type: object
      required: [id, created_at, expires_at]
      properties:
        id: { type: string, description: Opaque SHA-256 refresh-token digest }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
      example: { id: 8d7e5b3a0f6f4e1d..., created_at: '2026-01-01T00:00:00Z', expires_at: '2026-01-31T00:00:00Z' }
    AuditEntry:
      type: object
      required: [id, action, target, diff, at]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: [string, 'null'] }
        actor_id: { type: [string, 'null'] }
        action: { type: string }
        target: { type: string }
        diff: {}
        request_id: { type: [string, 'null'] }
        at: { type: string, format: date-time }
      example: { id: 1, team_id: 01J8Z3TEAM000000000000001, actor_id: 01J8Z3ADMIN000000000000001, action: user.created, target: 01J8Z3USER000000000000001, diff: { status: active }, request_id: req-01J8Z3, at: '2026-01-01T00:00:00Z' }
    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, format: int64, example: 600 }
      example: { access_token: eyJhbGciOiJFZERTQSIs..., refresh_token: refresh-token-opaque, token_type: Bearer, expires_in: 600 }
    MfaChallenge:
      type: object
      required: [mfa_required, mfa_token]
      properties:
        mfa_required: { type: boolean, const: true }
        mfa_token: { type: string }
      example: { mfa_required: true, mfa_token: eyJhbGciOiJFZERTQSIs... }
    IntrospectResponse:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        sub: { type: string }
        team: { type: string }
        kind: { type: string, enum: [user, service] }
        perm_ver: { type: integer, format: int64 }
        exp: { type: integer, format: int64 }
      example: { active: false }
    JsonWebKeySet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kid, kty, crv, alg, use, x]
            properties:
              kid: { type: string }
              kty: { type: string, example: OKP }
              crv: { type: string, example: Ed25519 }
              alg: { type: string, example: EdDSA }
              use: { type: string, example: sig }
              x: { type: string }
    AuthorizationCheckRequest:
      type: object
      required: [subject, permission, context]
      properties:
        subject: { type: string }
        permission: { type: string }
        context:
          type: object
          required: [resource]
          properties:
            resource:
              type: object
              required: [owner_id, team_id, attrs]
              properties:
                owner_id: { type: string }
                team_id: { type: string }
                attrs: { type: object, additionalProperties: true }
    AuthorizationCheckResponse:
      type: object
      required: [allow, matched, reason]
      properties:
        allow: { type: boolean }
        matched: { type: array, items: { type: string } }
        reason: { type: string }
      example: { allow: true, matched: [orders:read:team], reason: permission granted }
    EffectivePermissionsResponse:
      type: object
      required: [user_id, perm_ver, grants]
      properties:
        user_id: { type: string }
        perm_ver: { type: integer, format: int64 }
        grants:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key: { type: string }
              condition: { type: [string, 'null'] }
    TotpResponse:
      type: object
      required: [secret, otpauth_url]
      properties:
        secret: { type: string }
        otpauth_url: { type: string, format: uri }
    BackupCodesResponse:
      type: object
      required: [backup_codes]
      properties:
        backup_codes: { type: array, items: { type: string } }
    Passkey:
      type: object
      required: [id, created_at]
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
    ProfileExport:
      type: object
      required: [profile, memberships, effective_permissions, active_sessions, totp_enabled, passkey_count]
      properties:
        profile: { $ref: '#/components/schemas/Profile' }
        memberships:
          type: array
          items:
            type: object
            required: [group_id, team_id]
            properties:
              group_id: { type: string }
              team_id: { type: string }
        effective_permissions: { type: array, items: { type: string } }
        active_sessions: { type: array, items: { $ref: '#/components/schemas/SessionResponse' } }
        totp_enabled: { type: boolean }
        passkey_count: { type: integer, minimum: 0 }
    WebAuthnOptions:
      type: object
      additionalProperties: true
      description: WebAuthn options object produced by the go-webauthn library; fields vary between registration and login ceremonies.
    WebAuthnCredential:
      type: object
      additionalProperties: true
      description: Browser PublicKeyCredential JSON payload.
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        display_name: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    MfaLoginRequest:
      type: object
      required: [mfa_token, code]
      properties:
        mfa_token: { type: string }
        code: { type: string }
    ClientCredentialsRequest:
      type: object
      required: [client_id, client_secret]
      properties:
        client_id: { type: string }
        client_secret: { type: string, format: password }
    InviteAcceptRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, format: password }
        display_name: { type: [string, 'null'] }
    PasswordChangeRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password }
    EmailChangeRequest:
      type: object
      required: [new_email, password]
      properties:
        new_email: { type: string, format: email }
        password: { type: string, format: password }
    CreateUserRequest:
      type: object
      required: [username]
      properties:
        username: { type: string }
        email: { type: [string, 'null'], format: email }
        display_name: { type: string }
        password: { type: string, format: password }
        initial_password: { type: string, format: password }
    PatchUserRequest:
      type: object
      minProperties: 1
      properties:
        username: { type: string }
        email: { type: [string, 'null'], format: email }
        display_name: { type: string }
        status: { type: string, enum: [active, disabled] }
    CreateCredentialRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [password, service] }
        password: { type: string, format: password }
    UserBatchRequest:
      type: object
      required: [ids, op]
      properties:
        ids: { type: array, maxItems: 500, items: { type: string } }
        op: { type: string, enum: [disable, enable] }
    GroupMembersBatchRequest:
      type: object
      required: [user_ids]
      properties:
        user_ids: { type: array, maxItems: 500, items: { type: string } }
    TeamCreateRequest:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, disabled], default: active }
    TeamPatchRequest:
      type: object
      minProperties: 1
      properties:
        slug: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, disabled] }
    GroupCreateRequest:
      type: object
      required: [team_id, name]
      properties:
        team_id: { type: string }
        name: { type: string }
    GroupPatchRequest:
      type: object
      minProperties: 1
      properties:
        team_id: { type: string }
        name: { type: string }
    MembershipRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
        expires_at: { type: [string, 'null'], format: date-time }
    RoleCreateRequest:
      type: object
      required: [name]
      properties:
        team_id: { type: [string, 'null'] }
        name: { type: string }
    RolePatchRequest:
      type: object
      minProperties: 1
      properties:
        team_id: { type: [string, 'null'] }
        name: { type: string }
    SetRolePermissionsRequest:
      type: object
      minProperties: 1
      anyOf:
        - required: [permission_keys]
        - required: [permissions]
      properties:
        permission_keys: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string }, description: Legacy alias used when permission_keys is absent. }
    PermissionRequest:
      type: object
      required: [key, registered_by]
      properties:
        key: { type: string }
        description: { type: string }
        registered_by: { type: string }
    BindingRequest:
      type: object
      required: [role_id, subject_kind, subject_id]
      properties:
        team_id: { type: [string, 'null'] }
        role_id: { type: string }
        subject_kind: { type: string, enum: [user, group] }
        subject_id: { type: string }
        condition: { type: [string, 'null'] }
        expires_at: { type: [string, 'null'], format: date-time }
    InvitationRequest:
      type: object
      required: [email, username]
      properties:
        email: { type: string, format: email }
        username: { type: string }
        display_name: { type: string }
    CredentialCreatedResponse:
      type: object
      required: [user_id, username, kind]
      properties:
        user_id: { type: string }
        username: { type: string }
        kind: { type: string, enum: [password, service] }
        client_id: { type: string }
        client_secret: { type: string }
    RolePermissionsResponse:
      type: object
      required: [role_id, permissions]
      properties:
        role_id: { type: string }
        permissions: { type: array, items: { type: string } }
    BatchResult:
      type: object
      required: [id, ok]
      properties:
        id: { type: string }
        ok: { type: boolean }
        error: { type: string, enum: [invalid_id, not_found, already_member, operation_failed, duplicate_username, username_required, weak_password] }
    BatchResultsResponse:
      type: object
      required: [results]
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/BatchResult' } }
    ImportResult:
      type: object
      required: [row, username, ok]
      properties:
        row: { type: integer }
        username: { type: string }
        ok: { type: boolean }
        error: { type: string, enum: [username_required, weak_password, duplicate_username, operation_failed] }
        id: { type: string }
    ImportResultsResponse:
      type: object
      required: [results]
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/ImportResult' } }
    UserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        next_cursor: { type: string }
    TeamPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Team' } }
        next_cursor: { type: string }
    GroupPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Group' } }
        next_cursor: { type: string }
    RolePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Role' } }
        next_cursor: { type: string }
    PermissionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        next_cursor: { type: string }
    RoleBindingPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RoleBinding' } }
        next_cursor: { type: string }
    AuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        next_cursor: { type: integer, format: int64 }
