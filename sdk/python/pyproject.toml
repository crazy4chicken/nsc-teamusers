[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teamusers-sdk"
version = "0.1.0"
description = "Python SDK for teamusers: token verification, permission caching, ABAC, and middleware"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
dependencies = [
  "PyJWT[crypto]>=2.9",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
nats-py = [
  "nats-py>=2.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
