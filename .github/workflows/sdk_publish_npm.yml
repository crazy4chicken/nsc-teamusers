name: Publish TypeScript SDK

on:
  push:
    branches:
      - main
    paths:
      - 'sdk/ts/**'
      - '.github/workflows/sdk_publish_npm.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdk/ts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm-package
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whether the version is already published
        id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "teamusers-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.published.outputs.exists == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # NOTE: npm CLI publish (not pnpm publish) so OIDC trusted publishing is
      # honored; pnpm >= 11 spawns npm in a way that loses the OIDC exchange
      # (pnpm/pnpm#11566). No NODE_AUTH_TOKEN / registry-url on purpose: an
      # ambient token would shadow the OIDC authentication.

      - name: Set up pnpm
        if: steps.published.outputs.exists == 'false'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0

      - name: Install dependencies
        if: steps.published.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.published.outputs.exists == 'false'
        run: pnpm build

      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        run: npm publish --access public
